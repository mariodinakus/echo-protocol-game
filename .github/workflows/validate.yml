name: Validate ECHO HTML5 game
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game source
        run: |
          node -e "const fs=require('node:fs'); const html=fs.readFileSync('index.html','utf8');if(!html.includes('id=\"gameCanvas\"')||!html.includes('requestAnimationFrame(step)'))process.exit(1);let m=html.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)process.exit(1);fs.writeFileSync('/tmp/echo-script.js',m[1]);"
          node --check /tmp/echo-script.js
